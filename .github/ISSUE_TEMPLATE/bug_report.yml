name: الإبلاغ عن مشكلة
description: مشكلة في الموقع أو البناء أو إعداد النشر
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'لا ترفق أسرارًا أو بيانات خاصة. الثغرات الأمنية تُبلّغ وفق SECURITY.md.'
  - type: textarea
    id: description
    attributes:
      label: وصف المشكلة
      description: ماذا حدث؟
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: خطوات إعادة المشكلة
      placeholder: '1. افتح…'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: النتيجة المتوقعة
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: البيئة
      placeholder: 'المتصفح والنظام، أو إصدار Node.js ورابط Actions'
