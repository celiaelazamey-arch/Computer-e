name: Publish container (optional)

# Pages does NOT require a container. Nothing is published automatically.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the optional GHCR image (review FREE-GITHUB.md first)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.publish == true && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare a lowercase GHCR image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the static website image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Explain package visibility
        run: |
          echo 'Review Package settings and set Public if you want anonymous downloads.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A new GHCR package is not automatically public. No hosted website is created by this workflow.' >> "$GITHUB_STEP_SUMMARY"
